# Minimal configuration for local development in stand-alone mode.
# Admin access is open inside the container, but the ports are only published on 127.0.0.1.
[server]
port_rpc_admin
port_ws

[port_rpc_admin]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_ws]
port = 6006
ip = 0.0.0.0
admin = 0.0.0.0
protocol = ws

[node_size]
small

[node_db]
type = NuDB
path = /var/lib/rippled/db/nudb

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

[validators_file]
validators.txt

[ssl_verify]
0
