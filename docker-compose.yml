# Local development networks (LR2: no real funds) and, optionally, the API (NFR3).
# rippled runs in stand-alone mode: ledgers only close when ledger_accept is called.
services:
  rippled:
    image: rippleci/rippled
    # The image is only built for amd64; on Apple Silicon it runs under emulation.
    platform: linux/amd64
    command: ["--standalone", "--conf", "/etc/opt/ripple/rippled.cfg"]
    volumes:
      - ./docker/rippled:/etc/opt/ripple:ro
    ports:
      - "127.0.0.1:5005:5005"   # JSON-RPC (admin, local only)
      - "127.0.0.1:6006:6006"   # WebSocket
  anvil:
    image: ghcr.io/foundry-rs/foundry
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    command: ["anvil"]
    ports:
      - "127.0.0.1:8545:8545"

  # The API, with the local networks: docker compose --profile api up -d --build
  # It reads .env, but connects to the networks by their service names.
  # The contract must be deployed first and its address written in .env (see README).
  api:
    profiles: ["api"]
    build: .
    env_file: .env
    environment:
      XRPL_WS_URL: "ws://rippled:6006"
      EVM_RPC_URL: "http://anvil:8545"
      DB_PATH: "/data/api.sqlite"
    volumes:
      - api-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - rippled
      - anvil

  # The API with the public test networks: docker compose --profile testnet up -d --build
  api-testnet:
    profiles: ["testnet"]
    build: .
    env_file: .env.testnet
    environment:
      DB_PATH: "/data/api-testnet.sqlite"
    volumes:
      - api-testnet-data:/data
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  api-data:
  api-testnet-data:
